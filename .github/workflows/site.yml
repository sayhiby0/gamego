name: Publish site

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'scripts/**'
      - 'backend/**'
      - 'tests/**'
      - 'config/**'
      - 'package.json'
      - 'wrangler.json'
      - '.github/workflows/site.yml'
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      collect:
        description: Collect fresh public data
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: gamego-pages
  cancel-in-progress: false

jobs:
  build:
    if: ${{ github.repository == 'sayhiby0/gamego' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Test and validate public assets
        run: |
          npm test
          node scripts/check-public.mjs
      - name: Collect public data
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.collect == true) }}
        env:
          CONTENT_API_KEY: ${{ secrets.CONTENT_API_KEY }}
          CONTENT_SERVICE_TOKEN: ${{ secrets.CONTENT_SERVICE_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          variables = json.loads(Path('wrangler.json').read_text(encoding='utf-8')).get('vars', {})
          secrets = {'CONTENT_API_KEY', 'CONTENT_SERVICE_TOKEN'}
          for name, value in variables.items():
              if name.startswith('CONTENT_') and name not in secrets and isinstance(value, str):
                  os.environ[name] = value
          config = json.loads(Path('site/config.json').read_text(encoding='utf-8'))
          os.environ['CONTENT_PROCESS_URL'] = config['apiBase'].rstrip('/') + '/internal/content'
          result = subprocess.run(['python', 'scripts/pipeline.py'], check=False)
          if result.returncode not in (0, 2):
              raise SystemExit(f'Pipeline failed with exit code {result.returncode}')
          PY
      - name: Validate final public assets
        run: node scripts/check-public.mjs
      - name: Commit public snapshots
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.collect == true) }}
        run: |
          git add -- site/data
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'chore: refresh public snapshots'
            git push origin HEAD:main
          fi
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: ./site

  deploy:
    if: ${{ github.repository == 'sayhiby0/gamego' && github.ref == 'refs/heads/main' }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
